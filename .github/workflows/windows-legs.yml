# Windows legs: run the harness legs in headless Chrome on a GitHub-hosted Windows runner (and the same list on macOS
# as a like-for-like control). TEST BRANCH ONLY: it runs on a push to `windows-test` and by hand, never on main and
# never on a pull request, and it deploys nothing. See tests/harness/WINDOWS.md.
name: Windows legs

on:
  push:
    branches: [windows-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-legs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legs:
    name: Legs on ${{ matrix.os }} (${{ matrix.part.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        # The list in five parts, so no job runs for hours and the Windows-only legs report first.
        # --from / --to count the list's non-comment lines; --only matches a leg's output name.
        part:
          # A recheck of the legs that differed between the two systems in the first full run, once with a
          # focused page (as a user's window is) and once without. The full list in five parts is:
          #   win '--only ^win-' | a '--from 1 --to 85' | b '--from 86 --to 170' | c '--from 171 --to 255' | d '--from 256 --to 9999'
          - { name: focus, focus: 'on', args: '--only "^(win-|endsdate|prodends|autonoterename|interfonts|monthexport|monthwriter)"' }
          - { name: nofocus, focus: 'off', args: '--only "^(win-env|win-keys|endsdate|prodends)"' }
    defaults:
      run:
        shell: bash
    steps:
      # Before checkout, so the working tree is byte for byte what macOS has (Windows' git would write CRLF).
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Kept going on a failure so the legs still run; a red check here is itself a Windows finding.
      - name: Check the build
        continue-on-error: true
        run: npm run check

      - name: Hash the build (compare with the macOS build; sha1 is what macOS's shasum prints)
        run: node -e "const c=require('crypto'),b=require('fs').readFileSync('dist/index.html');for(const a of ['sha256','sha1'])console.log(a+'  '+c.createHash(a).update(b).digest('hex')+'  dist/index.html  '+b.length+' bytes')"

      - name: Run the legs
        env:
          XLEG_FOCUS: ${{ matrix.part.focus }}
        run: node tests/harness/xgate.mjs --out xgate-out --cap 600 ${{ matrix.part.args }}

      # summary.json is written only when xgate finishes; if the job hits its timeout, rebuild it from the legs that ran.
      - name: Summarize whatever ran
        if: always()
        run: node tests/harness/xgate.mjs --summarize --out xgate-out

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legs-${{ matrix.os }}-${{ matrix.part.name }}
          path: xgate-out
          retention-days: 3
          if-no-files-found: warn
