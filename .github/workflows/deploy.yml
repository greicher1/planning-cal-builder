# Build the Mantine app from src/ and, on request, publish it to GitHub Pages.
#
# THE CUTOVER IS DONE (31 Aug 2026, owner-approved). Pages Source is "GitHub Actions" and this
# workflow publishes dist/. The root index.html is no longer what users get; it stays in the repo
# as the v1.2.0 legacy app and the byte-identical releases/v1.2.0.html copy.
#
# TWO JOBS
#
# `build` runs on every push AND every pull request: npm ci, build, `npm run check`, then uploads
# dist/index.html as a plain artifact. On a PR that is the whole run -- a PR never deploys.
#
# `deploy` runs on push to main and on manual dispatch. Push to main IS the release, exactly as it
# was when Pages served the root index.html; the gate on that is the "never push unasked" rule in
# CLAUDE.md, not a second switch in here.
#
# ACTIONS ARE PINNED BY COMMIT SHA (audit N-7, 30 Sep 2026), each with its release as a comment. A tag
# can be moved to other code; a SHA cannot. All six are releases that run on Node 24 (the last v4-era
# run warned that checkout, setup-node and upload-artifact were being forced onto it), and
# upload-pages-artifact v5 pins upload-artifact v7 internally. To update one: take the release's
# commit (gh api repos/<owner>/<action>/commits/<tag> --jq .sha), and read its notes first.
#
# TO ROLL BACK A BAD RELEASE: redeploy the PREVIOUS release (owner's decision D7 (a), 13 Nov 2026; audit AUD2-006).
#   Actions > "Build and deploy" > Run workflow, on main, with "release" set to the version before the bad one
#   (e.g. v1.12.1). The deploy job then publishes releases/<that version>.html as the site, with a version.json
#   that matches it, and builds nothing, so it works even when main does not build. Then fix forward on main as
#   usual; the next push deploys main again. Reverting the bad commit on main and pushing is the other way back.
#   The release must be v1.4.1 or later (the first with the install gate), and the workflow checks the file is
#   the version it says. A calendar SAVED with the bad release can lose that release's newest settings when the
#   older one saves it (a newer file into an older app is not supported), so keep a rollback short.
# ⛔ NEVER roll back by switching Settings > Pages > Source to "Deploy from a branch". That serves the root
#   index.html, the v1.2.0 legacy app: it does not know the Region (every Production wrap date moves), has no
#   install gate, no Content-Security-Policy and no snapshot sanitizer, and its Save drops every setting since
#   v1.2.0 and every scenario but one, permanently (audit AUD2-006, measured). It was this file's documented
#   rollback until 13 Nov 2026.

name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Re-deploy the current main without a code change'
        type: boolean
        default: false
      release:
        description: 'EMERGENCY ROLLBACK ONLY: publish this stored release instead of main (e.g. v1.12.1). Leave empty otherwise.'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Never let two runs race; a queued deploy should supersede, not interleave.
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Vite 8 requires ^20.19.0 || >=22.12.0 (package.json has no engines field, so this is
          # the constraint to track). 22.x is the current LTS line.
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check the build
        # tools/check-build.mjs: one self-contained file, no unexpected external requests, the
        # frozen #table-wrap / #print-root containers intact, the NUL sentinel still a NUL, and
        # version.json in step with package.json.
        run: npm run check

      - name: Check the docs' line references
        # tools/check-refs.py guards PROJECT-CONTEXT section 14's symbol map against drift. It is
        # a real project rule, but stale docs must not block a deploy, so it only warns.
        continue-on-error: true
        run: python3 tools/check-refs.py

      - name: Check the rules files (warn only)
        # tools/check-governance.mjs (governance plan Phase 5, OUT-31): it blocks on the owner's computer and inside the
        # push guard, which already ran it on this exact commit before the push could happen. Here it only warns: a
        # deploy never stops over a rules file. A shallow checkout has no older main to compare rule IDs with.
        continue-on-error: true
        run: node tools/check-governance.mjs --warn-only

      - name: Upload the built file
        # A plain artifact, downloadable from the run summary. This is NOT the Pages artifact --
        # uploading one of those is what the deploy job does, deliberately separately.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-index-html
          path: dist/index.html
          if-no-files-found: error

  deploy:
    name: Deploy to Pages
    # THE CUTOVER HAPPENED 31 Aug 2026, owner-approved: the Mantine build is now the live site,
    # and `main` auto-deploys it exactly as it auto-deployed the root index.html before. Keeping
    # this manual-only would have silently changed the deploy model the owner already works to --
    # push to main IS the release, and the gate on that is the "never push unasked" rule in
    # CLAUDE.md, not a second switch here.
    # Still runs on a manual dispatch too, for re-deploying without a code change.
    # ⛔ AUDIT N-7: MAIN ONLY. `on.push` is already limited to main, but a manual "Run workflow" can
    # target ANY branch, and with deploy ticked it published that branch to the live site. The ref
    # test closes that door; a re-deploy still works by dispatching on main.
    # ⭐ ROLLBACK (D7 (a), 13 Nov 2026): a dispatch with `release` set publishes that stored release and does NOT wait on
    # the build of main succeeding (always()), because a rollback must work when main is what broke. A push and a plain
    # re-deploy still need the build to have passed, as before.
    if: >-
      always() && github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && needs.build.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy && inputs.release == '' && needs.build.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.release != ''))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      # Read-only, for "Wait until the run lists the Pages artifact" below: it reads this run's artifact list.
      actions: read
    environment:
      name: github-pages
      # From whichever Deploy attempt ran (the second runs only when the first failed; see below).
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    env:
      # The rollback's release, '' for every normal deploy (a push has no inputs). Read from here and never
      # interpolated into a script, so the typed text cannot run as shell.
      RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.RELEASE == ''
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        if: env.RELEASE == ''
        run: npm ci

      - name: Build
        if: env.RELEASE == ''
        run: npm run build

      - name: Check the build
        if: env.RELEASE == ''
        run: npm run check

      # (No "Include version.json" step any more: since 19 Nov 2026 the build writes dist/version.json itself, with the
      # build stamp the update bar compares (tools/build-stamp.mjs). Copying the root version.json over it would drop
      # that stamp, and the bar would again show only on a version cut. `npm run check` above holds the two together.)

      - name: ROLLBACK -- publish a stored release instead of main
        # dist/ is built here from releases/<release>.html: the release copy, byte-identical to that version's build
        # (CLAUDE.md's version cut), as index.html, and a version.json naming it, so the update check agrees with the
        # page. Refused unless the name is a version, the file exists, it states that version, and it has the
        # install gate (v1.4.1 on). Nothing is built, so a main that will not build cannot block it.
        if: env.RELEASE != ''
        run: |
          set -eu
          if ! printf '%s' "$RELEASE" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release must look like v1.12.1, got: $RELEASE"; exit 1
          fi
          FILE="releases/$RELEASE.html"; VER="${RELEASE#v}"
          [ -f "$FILE" ] || { echo "::error::no $FILE in the repo"; exit 1; }
          grep -q "\`$VER\`" "$FILE" || { echo "::error::$FILE does not state version $VER"; exit 1; }
          grep -q 'app-gate' "$FILE" || { echo "::error::$FILE has no install gate; roll back only to v1.4.1 or later"; exit 1; }
          rm -rf dist && mkdir dist
          cp "$FILE" dist/index.html
          printf '{ "version": "%s" }\n' "$VER" > dist/version.json
          echo "Rolling the live site back to $RELEASE ($(wc -c < dist/index.html) bytes)."

      - name: Setup Pages
        # Fails if Pages Source is still "Deploy from a branch". That failure is the guard: it
        # means the cutover step has not been done yet. See the header of this file.
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the Pages artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      # ⭐ THE ARTIFACT RACE (24 Nov 2026, tracker card deploy-artifact-race). deploy-pages starts by listing this run's
      # artifacts and stops at once if "github-pages" is not among them. GitHub lists a just-finished upload a moment
      # late, and deploy-pages asks about half a second after the upload step ends, so sometimes it finds only the build
      # job's dist-index-html: "Found 1 artifact(s)", "No artifacts named github-pages were found". The Deploy failed and
      # the Cloudflare step after it was skipped. Measured 24 Nov 2026: that was 7 of the 54 pushes to main from 19 to
      # 24 Nov, and every failed deploy in that span. Runs that worked had the same half-second gap and won the race; the
      # artifact was always listed when asked again later. Each of the 4 re-runs among the 7 then failed on "Multiple
      # artifacts named github-pages": deploy-pages counts every attempt's artifacts, so a re-run never deploys (REL-14).
      # Two steps make it robust:
      #  1. This one waits, at most about 60 s, until the run's artifact list holds the exact artifact the upload step
      #     just made (by its id, not just its name). If it never shows, it warns and goes on, so deploy-pages still
      #     reports the real error.
      #  2. deploy-pages lists artifacts through the artifact service, not the REST API this step can call, so the two
      #     could still disagree for a moment. The Deploy below therefore gets one more try, 15 s later, if its first
      #     attempt fails. The retry reuses the same artifact (nothing is uploaded again), so it is not the re-run REL-14
      #     forbids, whose harm is a second artifact.
      - name: Wait until the run lists the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: |
          set -u
          case "$ARTIFACT_ID" in
            ''|*[!0-9]*) echo "::warning::The upload gave no usable artifact id; waiting for any github-pages artifact instead."; ARTIFACT_ID='' ;;
          esac
          for i in $(seq 1 30); do
            ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages&per_page=100" \
                    --jq '.artifacts[].id' 2>/dev/null || true)
            if [ -n "$ids" ] && { [ -z "$ARTIFACT_ID" ] || grep -qx "$ARTIFACT_ID" <<< "$ids"; }; then
              echo "The run lists the Pages artifact (${ARTIFACT_ID:-by name}) after ${SECONDS} s, try $i."
              exit 0
            fi
            sleep 2
          done
          echo "::warning::After ${SECONDS} s the run still does not list the Pages artifact (${ARTIFACT_ID:-by name}); deploying anyway."

      - name: Deploy
        id: deployment
        # continue-on-error so a failed first attempt leaves the job running for the retry below; if the retry fails
        # too, the job fails and the Cloudflare step is skipped, as before.
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Pause before trying the deploy once more
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::The first Deploy attempt failed; trying once more in 15 s with the same artifact."
          sleep 15

      - name: Deploy (second attempt)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # ⭐ CLOUDFLARE PAGES: sptcal.pages.dev, behind a Cloudflare Access sign-in (CLOUDFLARE-ACCESS-PLAN.md, owner,
      # 18 Nov 2026). The SAME checked dist/ (or the same rollback copy) goes to both hosts for the switch-over window;
      # the build tells them apart by host and shows "SPTCal has moved" on the old one. After the window the GitHub
      # Pages steps above are removed (plan Phase E) and this is the only publish. AFTER the Pages deploy on purpose:
      # while users are still on the old address, a Cloudflare failure must not hold back their release.
      # The two secrets are the owner's (a token with ONLY Account > Cloudflare Pages > Edit; it expires 18 Nov 2028,
      # renew it before then) and are never printed. wrangler is pinned to an exact version, as the actions are by SHA.
      - name: Publish to Cloudflare Pages (sptcal.pages.dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3.114.17 pages deploy dist --project-name=sptcal --branch=main --commit-dirty=true
